<title>RHEL v praxi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:ital,wght@0,400;0,500;0,700;1,400&family=Red+Hat+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: horná lišta, ľavý zoznam kapitol, text kapitoly + prilepený terminál vpravo (široké), pod textom (úzke) */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#E4E7EC; --ink:#14171C; --muted:#586070; --line:#D3D8E0;
  --accent:#B3141C; --accent-ink:#FFFFFF; --accent-soft:#F7E3E4;
  --ok:#1F7A4D; --ok-soft:#DDF1E6; --warn:#9A5B00; --warn-soft:#FBEFD9; --info:#21579B; --info-soft:#E1ECF8;
  --term:#12151B; --term-ink:#D6DCE6; --term-dim:#7D8797; --t-user:#86C7A8; --t-path:#8DB6F2; --t-err:#F2918A; --t-sel:#2A3140;
  --f-display:"Red Hat Display", "Segoe UI", system-ui, sans-serif;
  --f-text:"Red Hat Text", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Red Hat Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#161920; --sunk:#1D212A; --ink:#E7E9EE; --muted:#9AA3B2; --line:#2A303B;
  --accent:#F0535B; --accent-ink:#1A0204; --accent-soft:#3A1A1D;
  --ok:#5CCB92; --ok-soft:#173226; --warn:#E3A84A; --warn-soft:#352812; --info:#7FB2F0; --info-soft:#16263A;
  --term:#0A0C10; --term-ink:#D6DCE6; --term-dim:#7D8797; --t-sel:#252C39;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#161920; --sunk:#1D212A; --ink:#E7E9EE; --muted:#9AA3B2; --line:#2A303B;
  --accent:#F0535B; --accent-ink:#1A0204; --accent-soft:#3A1A1D;
  --ok:#5CCB92; --ok-soft:#173226; --warn:#E3A84A; --warn-soft:#352812; --info:#7FB2F0; --info-soft:#16263A;
  --term:#0A0C10; --term-ink:#D6DCE6; --term-dim:#7D8797; --t-sel:#252C39;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink); font:15.5px/1.6 var(--f-text); margin:0}
a{color:var(--accent); text-underline-offset:2px}
code,kbd,pre,.mono{font-family:var(--f-mono)}
code{font-size:.88em; background:var(--sunk); padding:.08em .35em; border-radius:4px; overflow-wrap:anywhere}
kbd{font-size:.8em; border:1px solid var(--line); border-bottom-width:2px; background:var(--surface); padding:.05em .4em; border-radius:4px; white-space:nowrap}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; line-height:1.15; margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}

/* ---------- top bar ---------- */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:14px; height:56px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  background:var(--surface); border-bottom:1px solid var(--line)}
.menu{display:none; border:1px solid var(--line); background:var(--surface); border-radius:8px; width:38px; height:38px; font-size:18px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); min-width:0}
.logo{width:30px; height:30px; border-radius:7px; background:var(--term); color:var(--t-user); display:grid; place-items:center; font:700 13px var(--f-mono); flex:none}
.brand b{font:900 17px var(--f-display); letter-spacing:-.01em; white-space:nowrap}
.brand span.sub{color:var(--muted); font-size:13px; white-space:nowrap}
.bar nav{margin-left:auto; display:flex; align-items:center; gap:4px}
.bar nav a{color:var(--ink); text-decoration:none; font-weight:500; font-size:14px; padding:7px 10px; border-radius:7px}
.bar nav a:hover{background:var(--sunk)}
.bar nav a.on{background:var(--accent-soft); color:var(--accent)}
.overall{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-right:6px; font-variant-numeric:tabular-nums}
.track{width:80px; height:6px; border-radius:6px; background:var(--sunk); overflow:hidden}
.fill{height:100%; background:var(--accent); width:0; transition:width .4s}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:262px minmax(0,1fr); min-height:calc(100vh - 56px)}
.rail{position:sticky; top:calc(56px + env(safe-area-inset-top,0px)); height:calc(100vh - 56px - env(safe-area-inset-top,0px)); overflow:auto; border-right:1px solid var(--line); background:var(--surface); padding:16px 10px 40px max(10px, env(safe-area-inset-left,0px))}
.rail h2{font:700 11px var(--f-text); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:6px 10px 8px}
.rail ol{list-style:none; margin:0 0 18px; padding:0}
.rail a{display:grid; grid-template-columns:28px 1fr 10px; gap:6px; align-items:center; padding:6px 10px; border-radius:7px; color:var(--ink); text-decoration:none; font-size:14px; line-height:1.3}
.rail a:hover{background:var(--sunk)}
.rail a.on{background:var(--accent-soft); color:var(--accent); font-weight:500}
.rail .num{font:500 12px var(--f-mono); color:var(--muted); font-variant-numeric:tabular-nums}
.rail a.on .num{color:var(--accent)}
.dot{width:8px; height:8px; border-radius:50%; border:1.5px solid var(--line)}
.dot.part{border-color:var(--warn); background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.done{border-color:var(--ok); background:var(--ok)}
main{min-width:0; padding-block:28px 80px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* ---------- chapter grid ---------- */
.page{max-width:1320px; margin:0 auto}
.col{max-width:760px; margin:0 auto}
.page:has(> .chap){max-width:none}
.chap{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:32px; align-items:start}
@media (min-width:1241px){ .chap .txt{max-width:760px} }
.chap .txt{min-width:0}
.chap aside{position:sticky; top:calc(72px + env(safe-area-inset-top,0px)); min-width:0}
@media (max-width:1240px){ .chap{grid-template-columns:minmax(0,1fr)} .chap aside{position:static} .chap .txt{max-width:760px; margin:0 auto; width:100%} .chap aside{max-width:none; margin:0; width:100%} }

.eyebrow{font:700 12px var(--f-text); letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}
.txt h1, .col h1{font-size:clamp(28px,4vw,38px); font-weight:900; letter-spacing:-.02em; margin-bottom:12px}
.goal{display:flex; gap:12px; padding:12px 14px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line); margin:16px 0 8px}
.goal b{font:700 12px var(--f-text); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding-top:3px}
.parts{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0}
.chip{font-size:12.5px; padding:3px 9px; border-radius:20px; background:var(--sunk); color:var(--muted); font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.mini{display:flex; flex-wrap:wrap; gap:6px; margin:16px 0 4px; padding-bottom:16px; border-bottom:1px solid var(--line)}
.mini button{border:1px solid var(--line); background:var(--surface); border-radius:20px; font-size:13px; padding:4px 11px}
.mini button:hover{border-color:var(--accent); color:var(--accent)}
.mini button.em{background:var(--sunk)}
.body h3{font-size:21px; font-weight:700; margin:34px 0 10px; scroll-margin-top:80px}
.body p{margin:10px 0; max-width:68ch}
.body ul.ls{margin:10px 0; padding-left:20px} .body ul.ls li{margin:6px 0}

/* code / commands */
.cmd{display:flex; align-items:stretch; margin:8px 0; border-radius:8px; overflow:hidden; background:var(--term); color:var(--term-ink); font:14px/1.5 var(--f-mono)}
.cmd .c{flex:1; min-width:0; padding:9px 12px; overflow-x:auto; white-space:pre}
.cmd .c::before{content:"$ "; color:var(--term-dim)}
.cmd .note{display:block; font-family:var(--f-text); font-size:12.5px; color:var(--term-dim); white-space:normal; margin-top:2px}
.cmd .note::before{content:"# "}
.cmd .run{flex:none; border:0; border-left:1px solid #2a303b; background:transparent; color:var(--t-user); font:500 12.5px var(--f-text); padding:0 12px}
.cmd .run:hover{background:#1c212b}
pre.pre, .out{margin:10px 0; padding:11px 13px; border-radius:8px; background:var(--term); color:var(--term-ink); font:13.5px/1.55 var(--f-mono); overflow-x:auto; white-space:pre}
.out .p{color:var(--term-dim)}
.tbl{overflow-x:auto; margin:12px 0; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:8px 11px; border-bottom:1px solid var(--line); vertical-align:top}
th{font:700 12px var(--f-text); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:var(--sunk)}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
.callout{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; padding:11px 14px; border-radius:8px; margin:12px 0; font-size:14.5px}
.callout b.k{font:700 11px var(--f-text); letter-spacing:.08em; text-transform:uppercase; padding-top:3px}
.callout.tip{background:var(--info-soft)} .callout.tip b.k{color:var(--info)}
.callout.warn{background:var(--warn-soft)} .callout.warn b.k{color:var(--warn)}
.callout.new{background:var(--accent-soft)} .callout.new b.k{color:var(--accent)}
.flags{margin:12px 0; border:1px solid var(--line); border-radius:8px; background:var(--surface); overflow:hidden}
.flags header{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; padding:10px 13px; border-bottom:1px solid var(--line); background:var(--sunk)}
.flags header b{font:700 15px var(--f-mono)}
.flags header span{color:var(--muted); font-size:13.5px}
.flags header code{background:transparent; padding:0; font-size:12.5px; color:var(--muted); flex-basis:100%}
.flags dl{display:grid; grid-template-columns:minmax(90px,max-content) minmax(0,1fr); margin:0}
.flags dt,.flags dd{margin:0; padding:7px 13px; border-bottom:1px solid var(--line); font-size:14px}
.flags dt{font:500 13.5px var(--f-mono); color:var(--accent); white-space:nowrap}
.flags dl > :nth-last-child(-n+2){border-bottom:0}
.flags .ex{border-top:1px solid var(--line); padding:8px 13px; font-size:13.5px; display:grid; gap:4px}
.flags .ex div{display:flex; flex-wrap:wrap; gap:4px 10px}
.flags .ex code{white-space:normal}
.src{margin:10px 0; padding-left:18px; font-size:14px} .src li{margin:4px 0}

/* explain */
.ctx{margin:4px 0 14px; display:grid; gap:10px}
.ctx-sec{padding:12px 14px; border-radius:10px; background:var(--surface); border:1px solid var(--line)}
.ctx-sec h3{margin:0 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
.ctx-sec p{margin:6px 0; font-size:14.5px; line-height:1.5}
.ctx-cmds{display:grid; gap:6px}
.ctx-cmds div{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline}
.ctx-cmds code{font:500 13px var(--f-mono); overflow-wrap:anywhere}
.ctx-cmds span{font-size:13.5px; color:var(--muted)}
.ctx-pre{margin:8px 0; padding:8px 10px; border-radius:8px; background:var(--bg); font:12.5px var(--f-mono); white-space:pre-wrap; overflow-wrap:anywhere}
.ctx-tip{color:var(--muted)}
.ctx-port{color:var(--info)}
.ctx-det summary{cursor:pointer; font-size:14px; margin:6px 0}
.ctx-det .ex-rows{margin-top:6px}
.ctx-more{font-size:14px}
.annot{margin:14px 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.an-h{padding:8px 12px; font:600 13px var(--f-mono); border-bottom:1px solid var(--line); color:var(--muted)}
.an-rows{display:grid; grid-template-columns:minmax(0,max-content) minmax(220px,1fr)}
.an-c{display:block; padding:3px 12px; font:12.5px/1.55 var(--f-mono); white-space:pre; overflow-x:auto; background:var(--bg); border-right:1px solid var(--line)}
.an-n{padding:3px 12px; font-size:13.5px; line-height:1.45; color:var(--text)}
.an-n:empty{padding:0}
.an-rows > :nth-child(4n+1), .an-rows > :nth-child(4n+2){background-clip:padding-box}
.an-run{margin:0; border-top:1px solid var(--line); border-radius:0}
@media (max-width:760px){ .an-rows{grid-template-columns:minmax(0,1fr)} .an-c{border-right:0; white-space:pre-wrap; overflow-wrap:anywhere} .an-n{padding-bottom:8px; color:var(--muted)} .an-n:empty{display:none} }
textarea.search.exin{display:block; resize:vertical; min-height:44px; font:14px/1.5 var(--f-mono); white-space:pre; overflow:auto}
.sh-box{padding-left:0; padding-right:0}
.sh-box h3{padding:0 14px}
.sh-rows{display:grid; grid-template-columns:auto minmax(0,max-content) minmax(220px,1fr); font-size:13.5px}
.sh-rows > *{padding:3px 10px; border-top:1px solid var(--line)}
.sh-ln{color:var(--muted); font:12px var(--f-mono); text-align:right; user-select:none}
.sh-c{font:12.5px/1.55 var(--f-mono); white-space:pre; overflow-x:auto; background:var(--bg); max-width:52vw}
.sh-c.sh-mod{box-shadow:inset 3px 0 0 var(--accent)}
.sh-t{line-height:1.45}
.sh-t code{font-size:12.5px}
.sh-com{color:var(--muted)}
.sh-warn{display:inline-block; margin-left:6px; padding:0 6px; border-radius:6px; font-size:12px; color:var(--accent); border:1px solid currentColor}
@media (max-width:760px){ .sh-rows{grid-template-columns:auto minmax(0,1fr)} .sh-t{grid-column:2; border-top:0 !important; color:var(--muted); padding-bottom:8px} .sh-ln{grid-row:span 2} .sh-c{white-space:pre-wrap; overflow-wrap:anywhere; max-width:none} }
.logbox{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--bg)}
.lb-cmd{padding:8px 12px; font:600 12.5px var(--f-mono); color:var(--muted); border-bottom:1px solid var(--line)}
.lb-l{display:block; width:100%; text-align:left; padding:6px 12px; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--text); font:12.5px/1.5 var(--f-mono); white-space:pre-wrap; overflow-wrap:anywhere; cursor:pointer}
.lb-l:last-child{border-bottom:0}
.lb-l:hover{background:var(--surface)}
.lb-l.no{background:color-mix(in srgb, var(--accent) 14%, transparent); text-decoration:line-through; text-decoration-color:var(--accent)}
.lb-l.ok{background:color-mix(in srgb, var(--ok) 20%, transparent); box-shadow:inset 3px 0 0 var(--ok)}
.explain{margin:14px 0; padding:14px; border-radius:10px; background:var(--surface); border:1px solid var(--line)}
.ex-line{display:flex; flex-wrap:wrap; gap:6px; font:500 16px var(--f-mono); margin-bottom:12px}
.tok{padding:3px 7px; border-radius:6px; background:var(--sunk); border-bottom:3px solid transparent; cursor:default}
.tok.t-cmd{border-color:var(--ink)} .tok.t-flag{border-color:var(--accent)} .tok.t-arg{border-color:var(--info)} .tok.t-pipe{background:transparent; color:var(--muted)}
.tok.t-sub{color:var(--accent); border-color:var(--accent)}
.ex-rows{display:grid; grid-template-columns:minmax(64px,max-content) minmax(0,1fr); gap:5px 14px; font-size:14px}
.ex-rows .k{font:500 13.5px var(--f-mono); white-space:nowrap}
.ex-rows .k.k-flag{color:var(--accent)} .ex-rows .k.k-arg{color:var(--info)} .ex-rows .k.k-cmd{font-weight:700}
.ex-rows .v.unk{color:var(--muted); font-style:italic}

/* quiz & exercises */
.sect{margin-top:42px} .sect > h2{font-size:24px; font-weight:900; margin-bottom:4px; scroll-margin-top:80px} .sect > .sub{color:var(--muted); margin:0 0 14px; font-size:14.5px}
.q{padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); margin:10px 0}
.qt{display:flex; gap:8px; margin:0 0 10px; font-weight:500}
.qn{color:var(--muted); font-variant-numeric:tabular-nums}
.opts{display:grid; gap:6px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--bg); padding:8px 11px; border-radius:8px; font-size:14.5px}
.opt:hover{border-color:var(--muted)}
.opt .l{font:700 12px var(--f-mono); color:var(--muted); padding-top:3px}
.opt.right{border-color:var(--ok); background:var(--ok-soft)} .opt.right .l{color:var(--ok)}
.opt.wrong{border-color:var(--accent); background:var(--accent-soft)} .opt.wrong .l{color:var(--accent)}
.w{margin:10px 0 0; font-size:14px} .w.ok b{color:var(--ok)} .w.no b{color:var(--accent)}
.task{display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; padding:13px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); margin:10px 0}
.task.done{border-color:var(--ok)}
.task .st{width:24px; height:24px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font:700 12px var(--f-text); color:var(--muted)}
.task.done .st{border-color:var(--ok); background:var(--ok); color:var(--surface)}
.task p{margin:0 0 6px}
.task .acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; font-size:14px; font-weight:500; text-decoration:none; color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px; font-size:13px}
.reveal{margin-top:8px; padding:9px 11px; border-radius:8px; background:var(--sunk); font-size:14px}
.reveal pre{margin:4px 0 0; white-space:pre-wrap; font:13.5px/1.5 var(--f-mono)}
.pager{display:flex; justify-content:space-between; gap:10px; margin-top:40px; padding-top:18px; border-top:1px solid var(--line); flex-wrap:wrap}
.pager a{display:flex; flex-direction:column; text-decoration:none; color:var(--ink); padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); max-width:48%}
.pager a span{font-size:12px; color:var(--muted)}
.pager a b{font-family:var(--f-display)}
.pager a.next{margin-left:auto; text-align:right}

/* ---------- terminal ---------- */
.term{border-radius:12px; overflow:hidden; background:var(--term); color:var(--term-ink); border:1px solid #232934; display:flex; flex-direction:column}
.term-top{display:flex; align-items:center; gap:8px; padding:7px 10px; background:#1A1E26; border-bottom:1px solid #232934; font:500 12.5px var(--f-text); color:var(--term-dim); flex-wrap:wrap}
.term-top .ttl{font-family:var(--f-mono); color:var(--term-ink)}
.term-top .sp{flex:1}
.seg{display:inline-flex; border:1px solid #2f3643; border-radius:7px; overflow:hidden}
.seg button{background:transparent; border:0; color:var(--term-dim); padding:3px 9px; font-size:12px}
.seg button.on{background:#2C3341; color:var(--term-ink)}
.tbtn{background:transparent; border:1px solid #2f3643; color:var(--term-dim); border-radius:7px; padding:3px 9px; font-size:12px}
.tbtn:hover{color:var(--term-ink); border-color:#4a5262}
.term-out{flex:1; overflow:auto; padding:10px 12px 4px; font:var(--tfs,13px)/1.5 var(--f-mono); white-space:pre; min-height:260px; max-height:62vh}
.term.tall .term-out{min-height:52vh; max-height:none; height:60vh}
.term-out .e{color:var(--t-err)}
.term-out .pu{color:var(--t-user)} .term-out .pp{color:var(--t-path)} .term-out .pr{color:var(--t-err)}
.term-out .hint{color:var(--term-dim); font-style:italic}
.term-out .ai{white-space:pre-wrap; color:#C9D3E3; border-left:2px solid var(--t-path); padding-left:8px; display:block; white-space:pre-wrap; font-family:var(--f-text); font-size:14px}
.term-in{display:flex; align-items:center; gap:0; padding:4px 12px 10px; font:calc(var(--tfs,13px) + .5px)/1.5 var(--f-mono)}
